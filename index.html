<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PKM Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="logo">
      <div class="logo-icon">⬤</div>
      <div class="logo-text">PKM <span>BUILDER</span></div>
    </div>
    <div class="topbar-right">
      <div class="user-info" id="user-info"></div>
    </div>
  </header>
  <div class="main-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">My Teams</div>
        <button class="btn btn-primary btn-full" id="btn-new-team">+ New Team</button>
      </div>
      <div class="team-list" id="team-list">
        <div class="no-teams">Loading...</div>
      </div>
    </aside>
    <main class="content" id="content-area">
      <div class="empty-state">
        <div class="empty-state-icon">🏆</div>
        <h3>WELCOME TO<br>PKM BUILDER</h3>
        <p>Build and save competitive Pokémon teams.</p>
      </div>
    </main>
  </div>
</div>

<!-- IMPORT MODAL -->
<div class="modal-overlay" id="import-modal">
  <div class="modal-box modal-lg">
    <div class="modal-title">📥 Importar Equipo (Showdown)</div>
    <textarea id="import-modal-textarea" class="modal-textarea" placeholder="Pega aquí tu equipo en formato Showdown..."></textarea>
    <div class="modal-actions">
      <button class="btn btn-primary" id="btn-do-import">Importar</button>
      <button class="btn btn-ghost" id="btn-close-import">Cancelar</button>
    </div>
  </div>
</div>

<!-- EXPORT MODAL -->
<div class="modal-overlay" id="export-modal">
  <div class="modal-box modal-lg">
    <div class="modal-title">📋 Exportar Equipo (Showdown)</div>
    <textarea id="export-modal-textarea" class="modal-textarea" readonly></textarea>
    <div class="modal-actions">
      <button class="btn btn-primary" id="btn-copy-export">📄 Copiar al portapapeles</button>
      <button class="btn btn-ghost" id="btn-close-export">Cerrar</button>
    </div>
  </div>
</div>

<!-- AUTH OVERLAY -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon" style="width:48px;height:48px;margin:0 auto 12px;font-size:20px">⬤</div>
      <h1>PKM <span>BUILDER</span></h1>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login" id="tab-login">Login</button>
      <button class="auth-tab" data-tab="signup" id="tab-signup">Sign Up</button>
    </div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="trainer@pokemon.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="auth-error" id="auth-error"></div>
    <button class="btn btn-primary btn-full" id="btn-auth-submit">Continuar</button>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script type="module" src="app.js"></script>
</body>
</html>
