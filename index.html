<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Champions · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #010a10;
    --bg2:    #061820;
    --bg3:    #0a2028;
    --accent: #00e5ff;
    --border: rgba(0,220,255,0.15);
    --text:   #d8f8ff;
    --muted:  #5a9aaa;
  }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 50%, rgba(0,100,150,0.15) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 80% 30%, rgba(0,50,100,0.12) 0%, transparent 70%);
  }

  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    padding: 20px;
  }

  /* Logo / Header */
  .logo-area {
    text-align: center;
    margin-bottom: 36px;
  }
  .logo-title {
    font-family: 'Bebas Neue', cursive;
    font-size: 42px;
    letter-spacing: 2px;
    color: var(--text);
    line-height: 1;
  }
  .logo-title span { color: var(--accent); }
  .logo-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* Card */
  .card {
    background: linear-gradient(135deg, rgba(0,30,45,0.97) 0%, rgba(0,15,25,0.99) 100%);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 0 40px rgba(0,200,255,0.08);
  }

  /* Tabs */
  .tabs {
    display: flex;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 24px;
    gap: 3px;
  }
  .tab {
    flex: 1; text-align: center;
    padding: 8px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    cursor: pointer; color: var(--muted);
    transition: all 0.2s; border: none;
    background: transparent; font-family: inherit;
  }
  .tab.active {
    background: rgba(0,220,255,0.12);
    color: var(--accent);
    border: 0.5px solid rgba(0,220,255,0.3);
  }

  /* Form */
  .form { display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; }
  input {
    background: rgba(255,255,255,0.05);
    border: 0.5px solid rgba(255,255,255,0.12);
    border-radius: 8px; color: var(--text);
    padding: 10px 12px; font-size: 13px;
    font-family: inherit; outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: rgba(0,220,255,0.4); background: rgba(0,220,255,0.04); }
  input::placeholder { color: var(--muted); }

  .btn-submit {
    width: 100%; padding: 12px;
    background: rgba(0,220,255,0.12);
    border: 0.5px solid rgba(0,220,255,0.4);
    border-radius: 8px; color: var(--accent);
    font-size: 13px; font-weight: 700;
    font-family: inherit; cursor: pointer;
    letter-spacing: 0.5px; transition: all 0.2s;
    margin-top: 4px;
  }
  .btn-submit:hover { background: rgba(0,220,255,0.2); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .msg {
    font-size: 11px; text-align: center;
    padding: 8px 12px; border-radius: 6px;
    display: none;
  }
  .msg.error { background: rgba(255,80,80,0.12); color: #ff8080; border: 0.5px solid rgba(255,80,80,0.3); display: block; }
  .msg.success { background: rgba(100,220,130,0.12); color: #64dc82; border: 0.5px solid rgba(100,220,130,0.3); display: block; }

  .divider {
    text-align: center; font-size: 10px;
    color: var(--muted); margin: 4px 0;
    position: relative;
  }

  .loading {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(0,220,255,0.3);
    border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <div class="logo-area">
    <div class="logo-title">Pokémon <span>Champions</span></div>
    <div class="logo-sub">Team Builder</div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="showTab('login')">Iniciar sesión</button>
      <button class="tab" id="tab-register" onclick="showTab('register')">Registrarse</button>
    </div>

    <!-- Login form -->
    <div id="form-login">
      <div class="form">
        <div class="field">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="tu@email.com" autocomplete="email">
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="msg" id="login-msg"></div>
        <button class="btn-submit" id="login-btn" onclick="doLogin()">Iniciar sesión</button>
      </div>
    </div>

    <!-- Register form -->
    <div id="form-register" style="display:none">
      <div class="form">
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="reg-user" placeholder="entrenador123" autocomplete="username">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="tu@email.com" autocomplete="email">
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
        </div>
        <div class="msg" id="reg-msg"></div>
        <button class="btn-submit" id="reg-btn" onclick="doRegister()">Crear cuenta</button>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://altfgsmuwbifuojirugg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsdGZnc211d2JpZnVvamlydWdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTc2NjksImV4cCI6MjA5NTgzMzY2OX0.2Xf4hOr8aXW9Qa5e-oS3KKg3ojuedbE5VFDFwEpJz44';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Check if already logged in
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'dashboard.html';
});

function showTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').style.display    = tab === 'login'    ? '' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="loading"></span>Cargando...' : btn.dataset.label;
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.className = `msg ${type}`;
  el.textContent = text;
}

// Store original button labels
document.getElementById('login-btn').dataset.label = 'Iniciar sesión';
document.getElementById('reg-btn').dataset.label = 'Crear cuenta';

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  if (!email || !pass) return showMsg('login-msg', 'Completá todos los campos.', 'error');

  setLoading('login-btn', true);
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  setLoading('login-btn', false);

  if (error) return showMsg('login-msg', error.message, 'error');
  showMsg('login-msg', '¡Bienvenido!', 'success');
  setTimeout(() => window.location.href = 'dashboard.html', 600);
}

async function doRegister() {
  const username = document.getElementById('reg-user').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const pass     = document.getElementById('reg-pass').value;

  if (!username || !email || !pass) return showMsg('reg-msg', 'Completá todos los campos.', 'error');
  if (pass.length < 6) return showMsg('reg-msg', 'La contraseña debe tener al menos 6 caracteres.', 'error');

  setLoading('reg-btn', true);
  const { error } = await sb.auth.signUp({
    email, password: pass,
    options: { data: { username } }
  });
  setLoading('reg-btn', false);

  if (error) return showMsg('reg-msg', error.message, 'error');
  showMsg('reg-msg', '¡Cuenta creada! Revisá tu email para confirmar.', 'success');
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const loginVisible = document.getElementById('form-login').style.display !== 'none';
  if (loginVisible) doLogin();
  else doRegister();
});
</script>
</body>
</html>
