<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Champions · Mis Equipos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #010a10;
  --bg2:    #061820;
  --bg3:    #0a2028;
  --accent: #00e5ff;
  --border: rgba(0,220,255,0.15);
  --text:   #d8f8ff;
  --muted:  #5a9aaa;
  --green:  #64dc82;
  --purple: #c8b8ff;
}

body {
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 50% 40% at 10% 20%, rgba(0,100,150,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 40% 50% at 90% 80%, rgba(0,50,100,0.10) 0%, transparent 70%);
}

/* ── Top bar ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(1,10,16,0.95); backdrop-filter: blur(8px);
  border-bottom: 0.5px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 28px;
}
.topbar-logo {
  font-family: 'Bebas Neue', cursive;
  font-size: 22px; letter-spacing: 1.5px; color: var(--text);
}
.topbar-logo span { color: var(--accent); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.user-pill {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.04);
  border: 0.5px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 5px 12px;
}
.user-avatar {
  width: 24px; height: 24px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #0050ff);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
}
.user-name { font-size: 12px; font-weight: 600; color: var(--text); }
.btn-logout {
  font-size: 11px; padding: 5px 12px; border-radius: 6px;
  border: 0.5px solid rgba(255,255,255,0.12);
  background: transparent; color: var(--muted);
  cursor: pointer; font-family: inherit; transition: all 0.15s;
}
.btn-logout:hover { color: var(--text); background: rgba(255,255,255,0.06); }

/* ── Main content ── */
.main {
  position: relative; z-index: 1;
  max-width: 900px; margin: 0 auto;
  padding: 40px 24px;
}

.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 32px;
}
.page-title {
  font-size: 13px; font-weight: 700; color: var(--muted);
  letter-spacing: 1.5px; text-transform: uppercase;
}

/* ── New team CTA ── */
.btn-new {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-radius: 8px;
  background: rgba(100,220,130,0.12);
  border: 0.5px solid rgba(100,220,130,0.4);
  color: var(--green); font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
  text-decoration: none;
}
.btn-new:hover { background: rgba(100,220,130,0.22); transform: translateY(-1px); }
.btn-new svg { flex-shrink: 0; }

/* ── Teams grid ── */
.teams-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}

/* ── Team card ── */
.team-card {
  background: linear-gradient(135deg, rgba(0,30,45,0.97) 0%, rgba(0,15,25,0.99) 100%);
  border: 0.5px solid rgba(0,220,255,0.15);
  border-radius: 12px; overflow: hidden;
  transition: all 0.2s; cursor: pointer;
  box-shadow: 0 0 20px rgba(0,200,255,0.06);
}
.team-card:hover {
  border-color: rgba(0,220,255,0.35);
  box-shadow: 0 0 30px rgba(0,200,255,0.12);
  transform: translateY(-2px);
}
.team-card-body { padding: 18px 18px 14px; }
.team-card-name {
  font-size: 16px; font-weight: 700; color: var(--text);
  margin-bottom: 4px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.team-card-meta { font-size: 10px; color: var(--muted); margin-bottom: 14px; }

/* Pokémon sprite row */
/* Pokemon + item grid: 6 columns aligned */
.team-poke-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
  margin-bottom: 12px;
}
.team-poke-col {
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
}
.team-sprite-wrap {
  width: 100%; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.team-sprite {
  max-width: 100%; max-height: 40px; width: auto; height: auto;
  object-fit: contain; image-rendering: pixelated;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}
.team-sprite-placeholder {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.04);
  border: 0.5px dashed rgba(255,255,255,0.1);
}
.team-item-wrap {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
}
.team-item-img {
  max-width: 22px; max-height: 22px; object-fit: contain;
  image-rendering: pixelated;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
}
.team-item-placeholder { width: 22px; height: 22px; }

.team-card-footer {
  border-top: 0.5px solid rgba(255,255,255,0.06);
  padding: 10px 18px;
  display: flex; gap: 6px;
}
.tc-btn {
  flex: 1; padding: 6px 8px; border-radius: 6px;
  font-size: 10px; font-weight: 700; cursor: pointer;
  font-family: inherit; border: 0.5px solid; transition: all 0.15s;
  text-align: center;
}
.tc-open { background: rgba(0,220,255,0.08); border-color: rgba(0,220,255,0.3); color: var(--accent); }
.tc-open:hover { background: rgba(0,220,255,0.16); }
.tc-history { background: rgba(200,184,255,0.08); border-color: rgba(200,184,255,0.3); color: var(--purple); }
.tc-history:hover { background: rgba(200,184,255,0.16); }
.tc-delete { background: rgba(255,80,80,0.06); border-color: rgba(255,80,80,0.25); color: #ff8080; }
.tc-delete:hover { background: rgba(255,80,80,0.14); }

/* ── New team card (placeholder) ── */
.team-card-new {
  background: rgba(255,255,255,0.02);
  border: 0.5px dashed rgba(0,220,255,0.2);
  border-radius: 12px; min-height: 180px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px; cursor: pointer; transition: all 0.2s;
  color: var(--muted); font-size: 13px;
  text-decoration: none;
}
.team-card-new:hover {
  border-color: rgba(0,220,255,0.4);
  background: rgba(0,220,255,0.04);
  color: var(--accent);
}
.team-card-new-icon {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(0,220,255,0.08);
  border: 0.5px solid rgba(0,220,255,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}

/* ── Empty state ── */
.empty-state {
  grid-column: 1 / -1;
  text-align: center; padding: 60px 20px;
  color: var(--muted);
}
.empty-state-icon { font-size: 48px; margin-bottom: 14px; }
.empty-state-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.empty-state-sub { font-size: 12px; margin-bottom: 24px; }

/* ── History modal ── */
.modal-bg {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
}
.modal {
  background: #0d1a22; border: 0.5px solid rgba(0,220,255,0.2);
  border-radius: 12px; padding: 20px; width: 460px; max-width: 95vw;
  max-height: 80vh; display: flex; flex-direction: column;
  font-family: 'DM Sans', sans-serif;
}
.modal-hdr {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.modal-title { font-size: 14px; font-weight: 700; color: var(--text); }
.modal-close {
  background: none; border: none; color: var(--muted);
  font-size: 18px; cursor: pointer; line-height: 1;
}
.modal-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
.modal-item {
  background: rgba(255,255,255,0.04);
  border: 0.5px solid rgba(255,255,255,0.08);
  border-radius: 8px; padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.modal-item-info { flex: 1; min-width: 0; }
.modal-item-name { font-size: 12px; font-weight: 700; color: var(--text); }
.modal-item-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
.modal-empty { text-align: center; color: var(--muted); font-size: 12px; padding: 30px; }

/* ── Loading ── */
.loading-spinner {
  display: inline-block; width: 32px; height: 32px;
  border: 3px solid rgba(0,220,255,0.2);
  border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-wrap {
  grid-column: 1 / -1;
  display: flex; justify-content: center; padding: 60px;
}

/* Notification */
.notif {
  position: fixed; bottom: 20px; right: 20px; z-index: 300;
  background: rgba(100,220,130,0.15); border: 0.5px solid rgba(100,220,130,0.4);
  color: var(--green); border-radius: 8px; padding: 10px 16px;
  font-size: 12px; font-weight: 600;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.notif.show { opacity: 1; }

  /* ── Confirm modal ── */
  .confirm-bg {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
  }
  .confirm-box {
    background: #0d1a22; border: 0.5px solid rgba(0,220,255,0.2);
    border-radius: 12px; padding: 24px; width: 340px; max-width: 90vw;
    font-family: 'DM Sans', sans-serif; text-align: center;
  }
  .confirm-icon { font-size: 32px; margin-bottom: 12px; }
  .confirm-title { font-size: 14px; font-weight: 700; color: #d8f8ff; margin-bottom: 8px; }
  .confirm-text { font-size: 12px; color: #5a9aaa; margin-bottom: 20px; line-height: 1.5; }
  .confirm-btns { display: flex; gap: 8px; justify-content: center; }
  .confirm-btn {
    padding: 8px 20px; border-radius: 8px; font-size: 12px;
    font-weight: 700; cursor: pointer; border: 0.5px solid;
    font-family: 'DM Sans', sans-serif; transition: all 0.15s; min-width: 90px;
  }
  .confirm-btn-cancel {
    background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); color: #5a9aaa;
  }
  .confirm-btn-cancel:hover { color: #d8f8ff; background: rgba(255,255,255,0.1); }
  .confirm-btn-danger {
    background: rgba(255,80,80,0.1); border-color: rgba(255,80,80,0.4); color: #ff8080;
  }
  .confirm-btn-danger:hover { background: rgba(255,80,80,0.2); }

@media (max-width: 700px) {
  .main { padding: 16px 12px; }
  .teams-grid { grid-template-columns: 1fr; }
  .topbar { padding: 10px 14px; }
  .topbar-logo { font-size: 16px; }
  .user-name { display: none; }
  .team-card-footer { flex-wrap: wrap; }
  .tc-btn { flex: 1; min-width: 70px; }
}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-logo">Pokémon <span>Champions</span></div>
  <div class="topbar-right">
    <div class="user-pill">
      <div class="user-avatar" id="userAvatar">?</div>
      <span class="user-name" id="userName">Cargando...</span>
    </div>
    <button class="btn-logout" onclick="doLogout()">Cerrar sesión</button>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="page-header">
    <div class="page-title">Mis equipos</div>

  </div>

  <div class="teams-grid" id="teamsGrid">
    <div class="loading-wrap"><div class="loading-spinner"></div></div>
  </div>
</div>

<div class="notif" id="notif"></div>

<script>
const SUPABASE_URL = 'https://altfgsmuwbifuojirugg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsdGZnc211d2JpZnVvamlydWdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTc2NjksImV4cCI6MjA5NTgzMzY2OX0.2Xf4hOr8aXW9Qa5e-oS3KKg3ojuedbE5VFDFwEpJz44';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let _user = null;

// Auth guard
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  _user = session.user;

  const username = _user.user_metadata?.username || _user.email.split('@')[0];
  document.getElementById('userName').textContent = username;
  document.getElementById('userAvatar').textContent = username[0].toUpperCase();

  loadTeams();
}

async function loadTeams() {
  const { data: teams, error } = await sb
    .from('teams')
    .select('id, name, team_data, updated_at')
    .eq('user_id', _user.id)
    .order('updated_at', { ascending: false });

  const grid = document.getElementById('teamsGrid');

  if (error) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-state-title">Error cargando equipos</div><div class="empty-state-sub">${error.message}</div></div>`;
    return;
  }

  let html = '';

  if (teams.length === 0) {
    html += `
      <div class="empty-state">
        <div class="empty-state-icon">🎮</div>
        <div class="empty-state-title">No tenés equipos aún</div>
        <div class="empty-state-sub">Creá tu primer equipo para empezar</div>
      </div>`;
  } else {
    teams.forEach(t => {
      const pokes = Array.isArray(t.team_data) ? t.team_data : [];
      // Build 6-column grid: sprite + item aligned per pokemon
      const pokeGrid = Array.from({length: 6}, (_, i) => {
        const p = pokes[i];
        const sprite = p?.spriteId
          ? `<div class="team-sprite-wrap"><img class="team-sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/${p.spriteId}.gif" onerror="this.style.visibility='hidden'"></div>`
          : `<div class="team-sprite-wrap"><div class="team-sprite-placeholder"></div></div>`;

        // Items: try PokeAPI, fallback to Showdown item sprites
        let itemEl = `<div class="team-item-placeholder"></div>`;
        if (p?.itemSlug) {
          // Mega stones not in PokeAPI sprites — use a fallback icon
          const src = ITEM_IMAGES[p.itemSlug]
            || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/${p.itemSlug}.png`;
          itemEl = `<div class="team-item-wrap"><img class="team-item-img" src="${src}" title="${p.item || p.itemSlug}" onerror="this.style.visibility='hidden'"></div>`;
        }
        return `<div class="team-poke-col">${sprite}${itemEl}</div>`;
      }).join('');

      const date = new Date(t.updated_at).toLocaleDateString('es', { day:'2-digit', month:'short', year:'numeric' });

      html += `
        <div class="team-card">
          <div class="team-card-body" onclick="openTeam('${t.id}')">
            <div class="team-card-name">${escHtml(t.name)}</div>
            <div class="team-card-meta">Modificado: ${date} · ${pokes.length} Pokémon</div>
            <div class="team-poke-grid">${pokeGrid}</div>
          </div>
          <div class="team-card-footer">
            <button class="tc-btn tc-open" onclick="editTeam('${t.id}')">✏️ Editar</button>
            <button class="tc-btn tc-history" onclick="showHistory('${t.id}', '${escHtml(t.name)}')">🕐 Historial</button>
            <button class="tc-btn tc-delete" onclick="deleteTeam('${t.id}', event)">🗑️</button>
          </div>
        </div>`;
    });
  }

  // Always add "New team" card at the end
  html += `
    <div class="team-card-new" onclick="newTeam()">
      <div class="team-card-new-icon">+</div>
      <span>Crear nuevo equipo</span>
    </div>`;

  grid.innerHTML = html;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function newTeam() {
  sessionStorage.removeItem('loadTeamId');
  sessionStorage.setItem('autoEdit', '1');
  window.location.href = 'app.html';
}

function openTeam(teamId) {
  // View only — no edit mode
  sessionStorage.setItem('loadTeamId', teamId);
  sessionStorage.removeItem('autoEdit');
  window.location.href = 'app.html';
}

function editTeam(teamId) {
  // Open in edit mode
  sessionStorage.setItem('loadTeamId', teamId);
  sessionStorage.setItem('autoEdit', '1');
  window.location.href = 'app.html';
}

async function deleteTeam(teamId, e) {
  e.stopPropagation();
  showConfirm(
    '¿Eliminar equipo?',
    'Esta acción no se puede deshacer.',
    async () => {
      const { error } = await sb.from('teams').delete().eq('id', teamId);
      if (error) return alert('Error: ' + error.message);
      notify('Equipo eliminado');
      loadTeams();
    }
  );
  return; // actual delete happens inside callback
}

function notify(msg, duration = 2000) {
  const el = document.getElementById('notif');
  el.textContent = '✓ ' + msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

async function showHistory(teamId, teamName) {
  const { data: versions, error } = await sb
    .from('team_versions')
    .select('*')
    .eq('team_id', teamId)
    .order('version_number', { ascending: false });

  if (error) return alert('Error: ' + error.message);

  const modal = document.createElement('div');
  modal.className = 'modal-bg';

  const rows = versions.length === 0
    ? '<div class="modal-empty">Sin historial guardado aún.</div>'
    : versions.map(v => `
        <div class="modal-item">
          <div class="modal-item-info">
            <div class="modal-item-name">${escHtml(v.note || 'v' + v.version_number)}</div>
            <div class="modal-item-meta">${new Date(v.created_at).toLocaleString('es')}</div>
          </div>
          <button class="tc-btn tc-open" style="width:auto;white-space:nowrap;"
            onclick="restoreVersion('${teamId}', ${v.version_number})">Restaurar</button>
        </div>`).join('');

  modal.innerHTML = `
    <div class="modal">
      <div class="modal-hdr">
        <span class="modal-title">🕐 Historial · ${escHtml(teamName)}</span>
        <button class="modal-close" onclick="this.closest('.modal-bg').remove()">✕</button>
      </div>
      <div class="modal-list">${rows}</div>
    </div>`;

  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
  window._historyTeamId = teamId;
}

async function restoreVersion(teamId, versionNumber) {
  const { data, error } = await sb
    .from('team_versions')
    .select('team_data')
    .eq('team_id', teamId)
    .eq('version_number', versionNumber)
    .single();

  if (error) return alert('Error: ' + error.message);

  // Update team with this version's data
  await sb.from('teams').update({ team_data: data.team_data }).eq('id', teamId);

  document.querySelector('.modal-bg')?.remove();
  notify('Versión restaurada');
  loadTeams();

function showConfirm(title, text, onConfirm) {
  const bg = document.createElement('div');
  bg.className = 'confirm-bg';
  bg.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-icon">🗑️</div>
      <div class="confirm-title">${title}</div>
      <div class="confirm-text">${text}</div>
      <div class="confirm-btns">
        <button class="confirm-btn confirm-btn-cancel" id="confirmCancel">Cancelar</button>
        <button class="confirm-btn confirm-btn-danger" id="confirmOk">Eliminar</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#confirmCancel').addEventListener('click', () => bg.remove());
  bg.querySelector('#confirmOk').addEventListener('click', () => { bg.remove(); onConfirm(); });
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
}

async function doLogout() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

init();
