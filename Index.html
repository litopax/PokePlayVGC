<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PKM Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="logo">
      <div class="logo-icon">⬤</div>
      <div class="logo-text">PKM <span>BUILDER</span></div>
    </div>
    <div class="topbar-right">
      <div class="user-info" id="user-info"></div>
    </div>
  </header>

  <!-- MAIN -->
  <div class="main-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">My Teams</div>
        <button class="btn btn-primary btn-full" onclick="handleNewTeam()">+ New Team</button>
      </div>
      <div class="team-list" id="team-list">
        <div class="no-teams">Loading...</div>
      </div>
    </aside>

    <!-- CONTENT -->
    <main class="content" id="content-area">
      <div class="empty-state">
        <div class="empty-state-icon">🏆</div>
        <h3>WELCOME TO<br>PKM BUILDER</h3>
        <p>Build and save competitive Pokémon teams.</p>
      </div>
    </main>

  </div>
</div>

<!-- FORMAT MODAL -->
<div class="modal-overlay" id="format-modal" onclick="if(event.target===this)closeFormatModal()">
  <div class="modal-box">
    <div class="modal-title">Select Format</div>
    <div class="format-options">
      ${['OU','Ubers','UU','RU','NU','PU','LC','Doubles OU','VGC 2024','National Dex','Monotype','Random Battle'].map(f =>
        `<div class="format-option" onclick="selectFormat('${f}')">${f}</div>`
      ).join('')}
    </div>
    <button class="btn btn-ghost btn-full" onclick="closeFormatModal()">Cancel</button>
  </div>
</div>

<!-- AUTH OVERLAY -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon" style="width:48px;height:48px;margin:0 auto 12px;font-size:20px">⬤</div>
      <h1>PKM <span>BUILDER</span></h1>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login" onclick="handleAuthTabSwitch('login')">Login</button>
      <button class="auth-tab" data-tab="signup" onclick="handleAuthTabSwitch('signup')">Sign Up</button>
    </div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="trainer@pokemon.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="auth-error" id="auth-error"></div>
    <button class="btn btn-primary btn-full" onclick="handleAuthSubmit()">Continue</button>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-container" id="toast-container"></div>

<script type="module" src="app.js"></script>
</body>
</html>
