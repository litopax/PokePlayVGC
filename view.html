<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ver Equipo Pokémon</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020d12;--bg2:#061820;--bg3:#0a2028;--border:rgba(0,220,255,0.12);--text:#d8f8ff;--muted:#5a9aaa;--accent:#00e5ff}
body{background:#040d16;font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh}

/* Header */
.view-header{background:rgba(2,13,18,0.95);border-bottom:0.5px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);gap:10px}
.view-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--accent);flex-shrink:0}
.view-team-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:var(--text);opacity:0.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:center}
.view-badge{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);background:rgba(0,220,255,0.07);border:0.5px solid rgba(0,220,255,0.2);border-radius:20px;padding:3px 10px;flex-shrink:0}
@media(max-width:500px){.view-header{padding:10px 14px}.view-logo{font-size:16px}.view-team-name{font-size:14px}.view-badge{display:none}}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:24px;max-width:1100px;margin:0 auto}
@media(max-width:768px){.grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}}
@media(max-width:480px){.grid{grid-template-columns:1fr;padding:10px}.share-bar{flex-wrap:wrap;padding:10px 12px 0;gap:6px}.share-wa-btn,.copy-link-btn,.copy-showdown-btn{flex:1;justify-content:center;font-size:10px;padding:8px 10px}}

/* Card */
.card{width:100%;background:linear-gradient(145deg,rgba(7,24,40,0.98) 0%,rgba(4,13,22,1) 100%);border-radius:10px;overflow:hidden;position:relative;border:0.5px solid rgba(0,220,255,0.18);box-shadow:0 4px 24px rgba(0,0,0,0.35),inset 0 0.5px 0 rgba(255,255,255,0.05);animation:fadeUp 0.5s ease both;transition:box-shadow 0.25s,border-color 0.25s,transform 0.25s}
.card:hover{border-color:rgba(0,220,255,0.38);box-shadow:0 8px 40px rgba(0,200,255,0.15),0 0 0 0.5px rgba(0,220,255,0.15);transform:translateY(-2px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.card.is-shiny::before{content:'';position:absolute;inset:-1px;border-radius:6px;padding:1px;background:linear-gradient(135deg,#ffd700,#fff5a0,#c8a400,#fffbe0,#ffd700);background-size:300% 300%;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:shinyBorder 3s linear infinite;pointer-events:none;z-index:4}
@keyframes shinyBorder{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* Sprite */
.sprite-area{position:relative;height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sprite-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,var(--type-color,#333) 0%,transparent 70%);opacity:0.25}
.sprite-ring{position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--type-color,#333) 0%,transparent 70%);opacity:0.08}
.sprite-img{width:150px;height:150px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 8px 24px rgba(0,0,0,0.7));position:relative;z-index:1}
.star-field{position:absolute;inset:0;pointer-events:none;z-index:2}
.star{position:absolute;font-size:9px;color:#ffd700;opacity:0;line-height:1}
@keyframes starTwinkle{0%,100%{opacity:0;transform:scale(0.4) rotate(0deg)}50%{opacity:0.9;transform:scale(1) rotate(20deg)}}

/* Name bar */
.name-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 6px}
.pokemon-name{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;line-height:1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shiny-star{font-size:14px;color:#ffd700;margin-left:6px;flex-shrink:0}
.type-pills{display:flex;gap:4px;flex-shrink:0}
.type-pill{font-size:9px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;padding:3px 7px 2px;border-radius:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center}

/* Stats */
.stat-row{display:grid;grid-template-columns:34px 32px 1fr 28px;align-items:center;gap:6px;margin-bottom:5px}
.stat-lbl{font-size:12px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;color:rgba(255,255,255,0.4);text-align:right;line-height:1}
.stat-lbl.nat-up{color:#7090f8}
.stat-lbl.nat-down{color:#f87070}
.stat-val{font-size:12px;font-weight:700;color:var(--text);text-align:right;line-height:1}
.stat-val.nat-up{color:#7090f8}
.stat-val.nat-down{color:#f87070}
.stat-bar-bg{height:7px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;position:relative}
.stat-bar-fill{height:100%;border-radius:4px;background:var(--type-color,#7a7a9a);opacity:0.75;transition:width 0.6s cubic-bezier(0.4,0,0.2,1)}
.stat-bar-ev{position:absolute;top:0;height:100%;background:#f0c030;border-radius:0 3px 3px 0;opacity:0.9}
.stat-ev{font-size:12px;font-weight:700;color:#f0c030;text-align:left;min-width:20px}

/* Moves */
.move-row{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;border-radius:3px;margin-bottom:3px;gap:8px;border-left:2px solid rgba(140,100,255,0.5)}
.move-left{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.move-type-icon{width:18px;height:18px;object-fit:contain;flex-shrink:0;image-rendering:auto;border-radius:3px}
.move-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1;text-transform:uppercase;letter-spacing:0.3px}
.ability-name{font-size:12px;font-weight:700;color:var(--text);line-height:1;text-align:center;width:100%;text-transform:uppercase;letter-spacing:0.3px}
.item-name{font-size:12px;font-weight:600;color:var(--text);line-height:1;text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Type pills colors */
.t-normal{background:rgba(154,154,114,0.25);color:#d0d0a8;border:1px solid rgba(154,154,114,0.4)}
.t-fire{background:rgba(224,74,0,0.25);color:#ff8040;border:1px solid rgba(224,74,0,0.4)}
.t-water{background:rgba(41,128,200,0.25);color:#60b0f0;border:1px solid rgba(41,128,200,0.4)}
.t-grass{background:rgba(74,140,32,0.25);color:#70c040;border:1px solid rgba(74,140,32,0.4)}
.t-electric{background:rgba(216,184,0,0.25);color:#f0d040;border:1px solid rgba(216,184,0,0.4)}
.t-ice{background:rgba(120,200,216,0.25);color:#90dde8;border:1px solid rgba(120,200,216,0.4)}
.t-fighting{background:rgba(180,60,30,0.25);color:#e07050;border:1px solid rgba(180,60,30,0.4)}
.t-poison{background:rgba(156,64,168,0.25);color:#c070d8;border:1px solid rgba(156,64,168,0.4)}
.t-ground{background:rgba(180,140,60,0.25);color:#d4a860;border:1px solid rgba(180,140,60,0.4)}
.t-flying{background:rgba(136,153,224,0.25);color:#a8b8f0;border:1px solid rgba(136,153,224,0.4)}
.t-psychic{background:rgba(200,36,92,0.25);color:#f07898;border:1px solid rgba(200,36,92,0.4)}
.t-bug{background:rgba(100,140,40,0.25);color:#90c040;border:1px solid rgba(100,140,40,0.4)}
.t-rock{background:rgba(140,120,60,0.25);color:#c8a870;border:1px solid rgba(140,120,60,0.4)}
.t-ghost{background:rgba(115,87,151,0.25);color:#a880d0;border:1px solid rgba(115,87,151,0.4)}
.t-dark{background:rgba(74,58,44,0.35);color:#a08060;border:1px solid rgba(74,58,44,0.5)}
.t-dragon{background:rgba(80,96,200,0.25);color:#8090e8;border:1px solid rgba(80,96,200,0.4)}
.t-steel{background:rgba(170,170,192,0.2);color:#c0c8d8;border:1px solid rgba(170,170,192,0.35)}
.t-fairy{background:rgba(214,133,173,0.25);color:#f0a8cc;border:1px solid rgba(214,133,173,0.4)}

/* Loading / Error */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;color:var(--muted)}
.loading-spinner{width:40px;height:40px;border:3px solid rgba(0,220,255,0.15);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{text-align:center;padding:60px 20px;color:var(--muted)}
.error-msg h2{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--text);margin-bottom:8px;letter-spacing:1px}

/* Footer */
.view-footer{text-align:center;padding:24px;color:var(--muted);font-size:11px;border-top:0.5px solid var(--border);margin-top:20px}
.view-footer a{color:var(--accent);text-decoration:none}
.view-footer a:hover{text-decoration:underline}

/* WhatsApp share */
.share-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 24px 0;max-width:1100px;margin:0 auto}
.share-wa-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:rgba(96,208,96,0.1);border:0.5px solid rgba(96,208,96,0.3);color:#60d060;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif}
.share-wa-btn:hover{background:rgba(96,208,96,0.18)}
.copy-link-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:rgba(0,220,255,0.07);border:0.5px solid rgba(0,220,255,0.25);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif}
.copy-link-btn:hover{background:rgba(0,220,255,0.14)}
.copy-showdown-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:rgba(255,215,0,0.07);border:0.5px solid rgba(255,215,0,0.28);color:#ffd700;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif}
.copy-showdown-btn:hover{background:rgba(255,215,0,0.14)}
</style>
</head>

function moveTypeIcon(cls) {
  const type = cls.replace('mv-','');
  return TYPE_ICON_URL[type] || TYPE_ICON_URL.normal;
}

function calcStats(base, evs, nature) {
  const evMap = {};
  for (const [s,v] of evs) evMap[s] = parseInt(v)||0;
  const keys = ['HP','Atk','Def','SpA','SpD','Spe'];
  const mods = NATURE_MOD[nature] || [0,0,0,0,0];
  const modMap = {Atk:mods[0],Def:mods[1],SpA:mods[2],SpD:mods[3],Spe:mods[4]};
  return keys.map((k,i) => {
    const b = base[i]||80, ev = evMap[k]||0, iv=31, lv=50;
    let val;
    if(k==='HP') val = Math.floor(((2*b+iv)*lv/100)+lv+10)+ev;
    else { const bv=Math.floor(((2*b+iv)*lv/100)+5)+ev; const mod=modMap[k]||0; val=Math.floor(bv*(mod===1?1.1:mod===-1?0.9:1.0)); }
    return {key:k,val,mod:modMap[k]||0};
  });
}

function getSpriteUrl(p) {
  const id = p.spriteId || 0;
  if(!id) return '';
  if(p.shiny) return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/shiny/${id}.gif`;
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/${id}.gif`;
}

function buildCard(p) {
  if(!p || !p.name) return '';
  const types = (p.types||[]).map(t => Array.isArray(t)?t:[t,t]);
  const primaryType = types[0]?.[0] || 'normal';
  const typeColor = TYPE_COLOR[primaryType] || '#7a7a9a';
  const typePills = types.map(([cls,l]) => `<span class="type-pill t-${cls}">${l}</span>`).join('');
  const sprite = getSpriteUrl(p);
  const base = p._baseStats || [80,80,80,80,80,80];
  const stats = calcStats(base, p.evs||[], p.nature||'Hardy');
  const evMap = {}; for(const [k,v] of (p.evs||[])) evMap[k]=parseInt(v)||0;

  const statRows = stats.map(s => {
    const pct = Math.min(100, Math.round(s.val / MAX_STAT[s.key] * 100));
    const evPct = Math.round((evMap[s.key]||0) / MAX_STAT[s.key] * 100);
    const nc = s.mod===1?' nat-up':s.mod===-1?' nat-down':'';
    const STAT_LBL = {HP:'HP',Atk:'Atk',Def:'Def',SpA:'SpA',SpD:'SpD',Spe:'Spe'};
    return `<div class="stat-row">
      <div class="stat-lbl${nc}">${STAT_LBL[s.key]}</div>
      <div class="stat-val${nc}">${s.val}</div>
      <div class="stat-bar-bg">
        <div class="stat-bar-fill" style="width:${pct}%;background:${typeColor};"></div>
        ${evMap[s.key]>0?`<div class="stat-bar-ev" style="left:${pct}%;width:${evPct}%;"></div>`:''}
      </div>
      <div class="stat-ev">${evMap[s.key]>0?'+'+evMap[s.key]:''}</div>
    </div>`;
  }).join('');

  const moves = (p.moves||[]).map(([cls,m]) => {
    if(!m) return '';
    const iconUrl = moveTypeIcon(cls);
    return `<div class="move-row ${cls}">
      <div class="move-left">
        <img src="${iconUrl}" class="move-type-icon" alt="${cls.replace('mv-','')}" onerror="this.style.visibility='hidden'">
        <span class="move-name">${m}</span>
      </div>
    </div>`;
  }).filter(Boolean).join('');

  const shinyStars = p.shiny ? `<div class="star-field">${
    [[6,8],[6,88],[50,3],[50,93],[92,8],[92,88],[20,45],[75,55],[35,91],[65,5]]
    .map(([t,l],i)=>`<div class="star" style="top:${t}%;left:${l}%;animation:starTwinkle ${(1.4+i*0.28).toFixed(2)}s ease-in-out infinite -${(i*0.31).toFixed(2)}s;">✦</div>`)
    .join('')
  }</div>` : '';

  const itemSlug = p.itemSlug || '';
  const itemImgSrc = itemSlug ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/${itemSlug}.png` : '';

  return `<div class="card${p.shiny?' is-shiny':''}" style="--type-color:${typeColor};">
    <div class="name-bar">
      <div class="pokemon-name">${p.display||p.name||'—'}</div>
      ${p.shiny?'<span class="shiny-star">✦</span>':''}
      <div class="type-pills">${typePills}</div>
    </div>
    <div style="height:2px;background:linear-gradient(to right,${typeColor} ${types.length>1?'50%':'100%'},${types.length>1?(TYPE_COLOR[types[1]?.[0]]||typeColor):typeColor} ${types.length>1?'50%':'100%'});"></div>
    <div class="sprite-area">
      ${shinyStars}
      <div class="sprite-bg"></div>
      <div class="sprite-ring"></div>
      ${sprite?`<img class="sprite-img" src="${sprite}" alt="${p.name}" onerror="this.style.display='none'">`:''}
    </div>
    <div style="display:flex;padding:6px 10px 10px;gap:6px;">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;">
        <div style="background:rgba(255,255,255,0.03);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:8px;min-height:36px;">
          ${itemImgSrc?`<img src="${itemImgSrc}" alt="${p.item}" style="width:32px;height:32px;image-rendering:pixelated;flex-shrink:0;" onerror="this.style.visibility='hidden'">`:''}
          <span class="item-name">${p.item||'—'}</span>
        </div>
        ${moves}
      </div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;">
        <div style="background:var(--bg3);border-radius:8px;padding:6px 10px;display:flex;align-items:center;justify-content:center;min-height:36px;">
          <span class="ability-name">${p.ability||'—'}</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:0;">${statRows}</div>
      </div>
    </div>
  </div>`;
}

function toShowdownText(team) {
  return team.filter(p => p && p.name).map(p => {
    const lines = [];
    const nickname = p.nickname && p.nickname !== p.name ? `${p.nickname} (${p.name})` : p.name;
    lines.push(p.item ? `${nickname} @ ${p.item}` : nickname);
    if (p.ability) lines.push(`Ability: ${p.ability}`);
    if (p.level && p.level !== 50) lines.push(`Level: ${p.level}`);
    if (p.shiny) lines.push('Shiny: Yes');
    const evs = (p.evs || []).filter(([,v]) => parseInt(v) > 0).map(([k,v]) => `${v} ${k}`).join(' / ');
    if (evs) lines.push(`EVs: ${evs}`);
    if (p.nature) lines.push(`${p.nature} Nature`);
    const ivs = (p.ivs || []).filter(([,v]) => parseInt(v) !== 31).map(([k,v]) => `${v} ${k}`).join(' / ');
    if (ivs) lines.push(`IVs: ${ivs}`);
    (p.moves || []).filter(m => Array.isArray(m) ? m[1] : m && m.name).forEach(m => lines.push(`- ${Array.isArray(m) ? m[1] : m.name}`));
    return lines.join('\n');
  }).join('\n\n');
}

async function loadTeam() {
  // ── Apply language preference ──────────────────────────────────────────────
  const VB18N = {
    en:    { wa: '📱 WhatsApp', copy: '🔗 Copy link', copied: '✓ Copied', showdown: '📋 Showdown code', showdownCopied: '✓ Copied' },
    es_la: { wa: '📱 WhatsApp', copy: '🔗 Copiar link', copied: '✓ Copiado', showdown: '📋 Código Showdown', showdownCopied: '✓ Copiado' },
    es_es: { wa: '📱 WhatsApp', copy: '🔗 Copiar link', copied: '✓ Copiado', showdown: '📋 Código Showdown', showdownCopied: '✓ Copiado' },
  };
  let _vlang = 'en';
  try { const s = localStorage.getItem('pokemon_champions_lang'); if (VB18N[s]) _vlang = s; } catch(e) {}
  const _vt = k => (VB18N[_vlang] || VB18N.en)[k] || k;
  document.getElementById('shareWaBtn').textContent   = _vt('wa');
  document.getElementById('copyLinkBtn').textContent  = _vt('copy');
  document.getElementById('copyShowdownBtn').textContent = _vt('showdown');
  // ──────────────────────────────────────────────────────────────────────────
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t');
  if(!token) { showError(); return; }

  try {
    const { data, error } = await _sb.from('teams')
      .select('name, team_data')
      .eq('share_token', token)
      .single();
    if(error || !data) { showError(); return; }

    const teamName = data.name || 'Equipo';
    document.title = `${teamName} — VGC Builder`;
    document.getElementById('teamNameHeader').textContent = teamName;

    const team = Array.isArray(data.team_data) ? data.team_data : [];
    const grid = document.getElementById('grid');
    let html = '';
    for(const p of team) {
      if(p && p.name) html += `<div class="card-wrap">${buildCard(p)}</div>`;
    }
    grid.innerHTML = html || '<div style="color:var(--muted);padding:40px;grid-column:1/-1;text-align:center">Este equipo está vacío.</div>';

    // Share buttons
    const link = window.location.href;
    document.getElementById('shareWaBtn').onclick = () => {
      const msg = `Mirá mi equipo Pokémon "${teamName}" 🎮\n${link}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    };
    document.getElementById('copyLinkBtn').onclick = () => {
      navigator.clipboard.writeText(link).then(() => {
        const btn = document.getElementById('copyLinkBtn');
        const orig = btn.textContent;
        btn.textContent = _vt('copied');
        setTimeout(() => btn.textContent = orig, 2000);
      });
    };

    // Copy Showdown button
    document.getElementById('copyShowdownBtn').onclick = () => {
      const text = toShowdownText(team);
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyShowdownBtn');
        const orig = btn.textContent;
        btn.textContent = _vt('showdownCopied');
        setTimeout(() => btn.textContent = orig, 2000);
      });
    };

    document.getElementById('loadingEl').style.display = 'none';
    document.getElementById('contentEl').style.display = 'block';
  } catch(e) {
    console.error(e);
    showError();
  }
}

function showError() {
  document.getElementById('loadingEl').style.display = 'none';
  document.getElementById('errorEl').style.display = 'block';
}

loadTeam();
</script>
</body>
</html>
